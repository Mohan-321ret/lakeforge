[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lakeforge"
version = "0.1.0"
description = "Data Engineer's Source Inspection & Insight Tool — point at any data source, ask questions, get instant schema, profile, and safe NL Q&A."
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "duckdb>=0.10.0",
    "sqlalchemy>=2.0.0",
    "sqlglot>=24.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0.0",
    "rank-bm25>=0.2.2",
    "groq>=0.4.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[project.optional-dependencies]
databricks = [
    "databricks-sql-connector>=0.6.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]
pdf = [
    "pdfplumber>=0.10.0",
]
semantic = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.10.0",
    "mypy>=1.5.0",
    "pytest-xdist>=3.3.0",
]

[project.urls]
Repository = "https://github.com/yourusername/lakeforge"
Issues = "https://github.com/yourusername/lakeforge/issues"

[project.scripts]
lakeforge = "lakeforge.cli:app"

[tool.poetry]
name = "lakeforge"
version = "0.1.0"
description = "Data Engineer's Source Inspection & Insight Tool"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "lakeforge"}]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "D",
]
ignore = [
    "E501",
    "D100",
    "D101",
    "D102",
    "D104",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --cov=lakeforge --cov-report=html"
