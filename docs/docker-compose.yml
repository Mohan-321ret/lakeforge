version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lakeforge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LOG_LEVEL=INFO
    volumes:
      - ./sample_data.db:/app/sample_data.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lakeforge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lakeforge-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lakeforge-network

networks:
  lakeforge-network:
    driver: bridge
